[package]
name = "espforge-elements"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[build-dependencies]
# The Attrs generator reads the same schema the crate interprets at runtime.
# `espforge-schema` depends on nothing else in the workspace, so there is no
# cycle.
espforge-schema = { workspace = true }

[dependencies]
espf = { workspace = true }
espforge-diagnostics = { workspace = true }
espforge-schema = { workspace = true }
esp-metadata-generated = { workspace = true }
linkme = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
