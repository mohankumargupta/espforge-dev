name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Format and tests (no hardware, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Includes the byte-for-byte golden projects (comparison only, no cargo
      # on them; the ignored compile test is its own job).
      - run: cargo test --workspace

  generated-projects:
    name: Generated projects compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      # The compile test shares `target/generated-check`, so the default cache
      # path covers it.
      - uses: Swatinem/rust-cache@v2
      # The invariant this repo lacked: a change to the emitter is compiled
      # here, not discovered by a user running `espforge build`.
      - run: cargo test -p espforge --test generated_projects_compile -- --ignored
